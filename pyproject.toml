[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "green-attention"
version = "0.1.0.dev0"
description = "SM90 FP8 attention and GDN kernels for SGLang, loaded as a plugin"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# SGLang, torch, tvm_ffi and the CUDA toolkit come from SGLang's CUDA image
dependencies = []

# SGLang loads the package as a general plugin; --attention-backend green selects it
[project.entry-points."sglang.srt.plugins"]
green_attention = "green_attention.plugin:register"

[tool.setuptools.packages.find]
include = ["green_attention*"]

# the kernels' CUDA sources ship with the package and are compiled at runtime
[tool.setuptools.package-data]
"*" = ["*.cu", "*.cuh", "*.h", "*.hpp"]
